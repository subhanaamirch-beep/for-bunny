<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flowers for Her</title>
<style>
  /* ============================================================
     HOW TO CUSTOMIZE (read this!):
     1. Change "HER_NAME" below in the <h1> tag to her name.
     2. Scroll down to the <!-- MESSAGES --> section near the
        bottom and edit the text inside each <div class="bubble">.
        You can add or remove bubbles freely.
     3. Change flower colors by editing the CSS variables in
        the :root section below (--petal-color, --leaf-color).
     4. Save the file and double-click it to open in your browser.
  ============================================================ */

  :root {
    --petal-color: #ff5566;
    --petal-glow: #ff8899;
    --leaf-color: #1fae8e;
    --bg-color: #05010a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at bottom, #12041a 0%, var(--bg-color) 70%);
    overflow: hidden;
    font-family: 'Segoe UI', Georgia, serif;
  }

  /* twinkling stars */
  .stars {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, white, transparent),
      radial-gradient(1.5px 1.5px at 60% 10%, white, transparent),
      radial-gradient(2px 2px at 80% 40%, white, transparent),
      radial-gradient(1px 1px at 30% 70%, white, transparent),
      radial-gradient(1.5px 1.5px at 90% 80%, white, transparent),
      radial-gradient(1px 1px at 45% 85%, white, transparent),
      radial-gradient(2px 2px at 10% 90%, white, transparent);
    background-repeat: repeat;
    background-size: 400px 400px;
    opacity: 0.5;
    animation: twinkle 4s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes twinkle {
    from { opacity: 0.25; }
    to   { opacity: 0.65; }
  }

  h1 {
    text-align: center;
    color: #f2e9e4;
    font-weight: 400;
    font-size: 2.1rem;
    padding-top: 5vh;
    margin: 0;
    text-shadow: 0 0 15px rgba(255,255,255,0.25);
  }
  h1 span {
    color: var(--petal-glow);
  }

  .scene {
    position: relative;
    width: 100%;
    height: 78vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* --- Flower --- */
  .flower-bed {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 40px;
    filter: drop-shadow(0 0 25px rgba(255,90,110,0.35));
  }

  .stem {
    position: relative;
    width: 6px;
    background: linear-gradient(to top, var(--leaf-color), #2fd6ab);
    border-radius: 3px;
    transform-origin: bottom center;
    animation: sway 4s ease-in-out infinite;
    box-shadow: 0 0 8px rgba(60,220,180,0.5);
  }
  .stem:nth-child(1) { height: 220px; animation-delay: 0s; }
  .stem:nth-child(2) { height: 300px; animation-delay: 0.6s; }
  .stem:nth-child(3) { height: 250px; animation-delay: 1.2s; }
  .stem:nth-child(4) { height: 190px; animation-delay: 1.8s; }
  .stem:nth-child(5) { height: 270px; animation-delay: 0.3s; }
  .stem:nth-child(6) { height: 230px; animation-delay: 0.9s; }
  .stem:nth-child(7) { height: 210px; animation-delay: 1.5s; }

  @keyframes sway {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }

  .leaf {
    position: absolute;
    bottom: 20px;
    width: 40px;
    height: 22px;
    background: var(--leaf-color);
    border-radius: 0 100% 0 100%;
    opacity: 0.85;
  }
  .leaf.left  { left: -35px; transform: rotate(20deg); }
  .leaf.right { right: -35px; transform: rotate(-20deg) scaleX(-1); }

  .flower-head {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 48px;
    height: 48px;
  }
  .petal {
    position: absolute;
    width: 22px;
    height: 28px;
    background: radial-gradient(circle at 50% 20%, var(--petal-glow), var(--petal-color));
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    top: 50%;
    left: 50%;
    transform-origin: 50% 100%;
    box-shadow: 0 0 10px var(--petal-glow);
  }
  .petal:nth-child(1) { transform: translate(-50%,-100%) rotate(0deg); }
  .petal:nth-child(2) { transform: translate(-50%,-100%) rotate(72deg); }
  .petal:nth-child(3) { transform: translate(-50%,-100%) rotate(144deg); }
  .petal:nth-child(4) { transform: translate(-50%,-100%) rotate(216deg); }
  .petal:nth-child(5) { transform: translate(-50%,-100%) rotate(288deg); }
  .center {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #fff6c8;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 12px #ffe98a;
  }

  /* --- color variants for variety --- */
  .flower-head.pink   { --petal-color: #ff5566; --petal-glow: #ff8899; }
  .flower-head.purple { --petal-color: #b565ff; --petal-glow: #d9a4ff; }
  .flower-head.yellow { --petal-color: #ffb545; --petal-glow: #ffd98a; }
  .flower-head.blue   { --petal-color: #4aa8ff; --petal-glow: #9fd4ff; }
  .flower-head.white  { --petal-color: #f2f2f2; --petal-glow: #ffffff; }

  /* size variety */
  .flower-head.small { width: 38px; height: 38px; }
  .flower-head.small .petal { width: 18px; height: 22px; }
  .flower-head.large { width: 56px; height: 56px; }
  .flower-head.large .petal { width: 26px; height: 33px; }

  /* --- decorative emojis scattered around the page --- */
  .decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .decor span {
    position: absolute;
    font-size: 1.8rem;
    opacity: 0.8;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.15));
    animation: float 6s ease-in-out infinite;
  }

  .scene, h1, footer { position: relative; z-index: 1; }

  .center-message {
    position: absolute;
    top: 22%;
    left: 42%;
    transform: translate(-50%, -50%);
    color: #ffdfe4;
    font-size: 1.4rem;
    font-style: italic;
    text-align: center;
    text-shadow: 0 0 18px rgba(255,90,120,0.6), 0 0 6px rgba(255,255,255,0.4);
    z-index: 2;
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    background: rgba(90, 10, 20, 0.55);
    border: 1px solid rgba(255,90,110,0.6);
    color: #ffe3e6;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    max-width: 180px;
    text-align: center;
    box-shadow: 0 0 15px rgba(255,60,80,0.35);
    animation: float 5s ease-in-out infinite;
    backdrop-filter: blur(2px);
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-12px); }
  }

  .b1 { top: 15%; left: 6%;  animation-delay: 0s; }
  .b2 { top: 30%; right: 6%; animation-delay: 1s; }
  .b3 { top: 55%; left: 3%;  animation-delay: 2s; }
  .b4 { top: 60%; right: 4%; animation-delay: 1.5s; }
  .b5 { top: 5%;  right: 20%; animation-delay: 0.7s; }

  footer {
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-size: 0.75rem;
    padding-bottom: 12px;
  }
</style>
</head>
<body>

  <div class="stars"></div>

  <div class="decor">
    <span style="top:3%; left:4%; animation-delay:0s;">🌸</span>
    <span style="top:8%; left:15%; animation-delay:1.2s;">🐰</span>
    <span style="top:4%; right:6%; animation-delay:0.5s;">🎀</span>
    <span style="top:12%; right:16%; animation-delay:1.8s;">🌺</span>
    <span style="top:2%; left:50%; animation-delay:2.2s;">🌷</span>

    <span style="top:38%; left:2%; animation-delay:0.8s;">🎀</span>
    <span style="top:48%; left:8%; animation-delay:2s;">🌸</span>
    <span style="top:70%; left:3%; animation-delay:1.5s;">🐰</span>

    <span style="top:40%; right:3%; animation-delay:1s;">🌺</span>
    <span style="top:52%; right:9%; animation-delay:2.4s;">🎀</span>
    <span style="top:72%; right:4%; animation-delay:0.3s;">🌷</span>

    <span style="bottom:4%; left:6%; animation-delay:1.7s;">🌸</span>
    <span style="bottom:8%; left:20%; animation-delay:0.9s;">🎀</span>
    <span style="bottom:5%; right:8%; animation-delay:1.1s;">🐰</span>
    <span style="bottom:9%; right:22%; animation-delay:2.6s;">🌺</span>
    <span style="bottom:2%; left:50%; animation-delay:0.4s;">🌷</span>
  </div>

  <h1>For <span>Ryaan (Bunny)</span> 🌸</h1>

  <div class="scene">

    <!-- MESSAGES: edit, add, or remove bubbles here -->
    <div class="center-message">i love you so much<br>meri jaan 🌸</div>
    <div class="bubble b1">You are my favorite person</div>
    <div class="bubble b2">I'm lucky to have you</div>
    <div class="bubble b3">You make my world brighter 💗</div>
    <div class="bubble b4">Every flower reminds me of you</div>
    <div class="bubble b5">Forever grateful for you</div>

    <div class="flower-bed">
      <div class="stem">
        <div class="leaf left"></div>
        <div class="flower-head pink">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div>
          <div class="center"></div>
        </div>
      </div>
      <div class="stem">
        <div class="leaf right"></div>
        <div class="flower-head purple large">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div>
          <div class="center"></div>
        </div>
      </div>
      <div class="stem">
        <div class="leaf left"></div>
        <div class="flower-head yellow small">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div>
          <div class="center"></div>
        </div>
      </div>
      <div class="stem">
        <div class="leaf right"></div>
        <div class="flower-head blue">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div>
          <div class="center"></div>
        </div>
      </div>
      <div class="stem">
        <div class="leaf left"></div>
        <div class="flower-head white large">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div>
          <div class="center"></div>
        </div>
      </div>
      <div class="stem">
        <div class="leaf right"></div>
        <div class="flower-head pink small">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div>
          <div class="center"></div>
        </div>
      </div>
      <div class="stem">
        <div class="leaf left"></div>
        <div class="flower-head purple">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div>
          <div class="center"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>made with code, just for you</footer>

</body>
</html>
